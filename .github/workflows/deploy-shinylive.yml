# Publish the dashboard as a static Shinylive website on GitHub Pages.
# The app runs entirely in the visitor's browser: uploaded Excel files are
# read on their own computer and never sent to a server. Only app code and
# blank templates are published (see deploy/build_shinylive.R).
#
# One-time setup: repository Settings -> Pages -> Source: GitHub Actions.
# Afterwards every push to main rebuilds and republishes the site.

name: Deploy Shinylive site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RENV_CONFIG_AUTOLOADER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.3"
          use-public-rspm: true

      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libarchive-dev libcurl4-openssl-dev

      - name: Install R packages
        run: >
          Rscript --vanilla -e 'install.packages(c("shinylive", "shiny", "bslib",
          "bsicons", "readxl", "writexl"), lib = Sys.getenv("R_LIBS_USER"))'

      - name: Build the Shinylive site
        run: Rscript --vanilla deploy/build_shinylive.R

      - name: Check that no report data is published
        run: |
          if find _site -iname '*.xlsx' -o -iname '*.xls' | grep -q .; then
            echo "Excel files found in _site; refusing to publish." && exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
